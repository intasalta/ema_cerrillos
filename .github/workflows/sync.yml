name: Sincronizar EMA Cerrillos con Supabase

on:
  # Se ejecuta automáticamente cada vez que se actualiza el archivo downld08.csv en main
  push:
    paths:
      - 'downld08.csv'
  # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas supabase

      - name: Sincronizar datos hacia Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python sync_supabase.py
