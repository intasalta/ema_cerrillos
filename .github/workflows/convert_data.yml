name: Convert Meteorologic Data to CSV and XLSX

on:
  workflow_dispatch:   # <--- Agrega esta linea
  push:
    paths:
      - '*.txt'          # Se ejecuta cuando se sube o actualiza un .txt
  schedule:
       
    - cron: '10 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install pandas openpyxl

      - name: Ejecutar script de conversión
        run: python parse_data.py

      - name: Subir cambios formateados al repositorio
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'Auto-conversión de datos meteorológicos a CSV y XLSX'
          file_pattern: '*.csv *.xlsx'
